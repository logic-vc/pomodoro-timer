<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="직관적인 드래그 인터랙션으로 시간을 설정할 수 있는 포모도로 타이머">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Pomodoro Timer</h1>
        </header>

        <main class="timer-section">
            <div class="timer-container">
                <canvas id="timer-canvas" width="300" height="300"></canvas>
                <div class="timer-display">
                    <span id="time-display" class="time-text">25:00</span>
                    <span id="status-text" class="status-text">드래그하여 시간 설정</span>
                </div>
            </div>

            <!-- Quick Time Buttons -->
            <div class="quick-time-buttons">
                <button class="quick-time-btn" data-minutes="5">+5분</button>
                <button class="quick-time-btn" data-minutes="10">+10분</button>
                <button class="quick-time-btn" data-minutes="30">+30분</button>
                <button class="quick-time-btn" data-minutes="60">+60분</button>
            </div>

            <div class="controls">
                <button id="start-btn" class="control-btn primary" aria-label="타이머 시작">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span>시작</span>
                </button>
                <button id="pause-btn" class="control-btn" aria-label="타이머 일시정지" disabled>
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                    <span>정지</span>
                </button>
                <button id="reset-btn" class="control-btn" aria-label="타이머 리셋">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    <span>리셋</span>
                </button>
            </div>
        </main>

        <!-- Settings Section - Single Row -->
        <section class="settings-section">
            <div class="settings-row">
                <div class="setting-item-inline">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                    <span>소리</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-divider"></div>
                <div class="setting-item-inline">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                    </svg>
                    <span>화면</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="flash-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <footer class="app-footer">
            <p>© 2024 Pomodoro Timer</p>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
